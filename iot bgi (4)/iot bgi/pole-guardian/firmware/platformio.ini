[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Library dependencies
lib_deps = 
    mobizt/Firebase Arduino Client Library for ESP32 and ESP8266@^4.4.12
    bblanchon/ArduinoJson@^6.21.3

; Upload options
upload_speed = 921600

; Partition scheme
board_build.partitions = huge_app.csv